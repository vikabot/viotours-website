# viotours.in — nginx server block. Copy to /etc/nginx/sites-available/viotours and enable.
# TLS: run `sudo certbot --nginx -d viotours.in -d www.viotours.in` after the first reload.

server {
    listen 80;
    server_name viotours.in;
    return 301 https://www.viotours.in$request_uri;
}

server {
    listen 80;
    server_name www.viotours.in;

    root /var/www/viotours/dist;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long cache for fonts, icons, audio; short for HTML/CSS/JS so edits show quickly.
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { expires 1h; }

    # Form endpoint (server/enquiry_server.py on 127.0.0.1:8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
